[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.12.23,<0.13"]

[project]
authors = [{ name = "Thibault Derousseaux" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  # The versions CI tests.
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = [
  "graphql-core>=3.3.0",
  # Python 3.15 is the first whose standard library has all it provides.
  "typing-extensions>=4.16.0; python_version < '3.15'",
]
description = "Turn a GraphQL schema and your operations into a typed Python package with no imposed transport, no runtime dependencies, and no runtime validation"
keywords = [
  "client",
  "code generation",
  "codegen",
  "graphql",
  "sans-io",
  "typeddict",
]
license = "MIT"
license-files = ["LICENSE"]
name = "graphql-codegen"
readme = "README.md"
requires-python = ">=3.12"
version = "0.2.0"

[project.optional-dependencies]
# Only reading a YAML graphql-config file needs it.
yaml = ["pyyaml>=6.0.3"]

[project.scripts]
graphql-codegen = "graphql_codegen._cli:main"

[project.urls]
Documentation = "https://github.com/tibdex/graphql-codegen#readme"
Source = "https://github.com/tibdex/graphql-codegen"
Issues = "https://github.com/tibdex/graphql-codegen/issues"

[dependency-groups]
dev = [
  "coverage",
  "httpx2",          # The bookshop's transport.
  "pyright[nodejs]", # With the Node.js it runs on, rather than whichever is installed.
  "pyrefly",
  "pytest",
  "pyyaml",
  "ruff",
  "ty",
  "types-pyyaml",    # So that `_get_loader()` can return `yaml.safe_load` typed.
  "prek",
]

[tool.uv.build-backend]
module-name = "graphql_codegen"
# The document `_introspection_graphql.py` is generated from, which only the tests regenerate it with.
wheel-exclude = ["*.graphql"]

[tool.coverage.run]
branch = true
# Combining is what merges the runtime's copy into the runtime, per `paths`.
parallel = true
# `python -m graphql_codegen` runs in a subprocess.
patch = ["subprocess"]
# The bookshop's copy of the runtime too: its tests exercise that copy.
source_pkgs = ["bookshop.graphql.runtime", "graphql_codegen"]

[tool.coverage.paths]
# Each file of the bookshop's runtime counts as the one it is copied from, which `test_cli.py` checks it is, but for its first line.
runtime = ["src/graphql_codegen/runtime/", "*/bookshop/graphql/runtime/"]

[tool.coverage.report]
exclude_also = [
  # The arm of an exhaustive `match` a type checker proves unreachable.
  '^[ \t]*case _ as never:\n[ \t]*assert_never\(never\)$',
  # A version check and its `else`: each branch runs on its own Python versions only, and only imports names, which its versions' tests already need.
  '^if sys\.version_info >= \(3, \d+\):\n(?:[ \t]+.*\n|\n)*else:$',
  "@overload",
]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pytest]
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  # Generated.
  "bookshop/graphql",
  "bookshop/*_graphql.py",
  "src/graphql_codegen/_cli/*_graphql.py",
  # Its code blocks are the generated package's and the bookshop's modules verbatim, which `test_readme.py` checks.
  "README.md",
]

[tool.ruff.lint]
# Preview mode, for naming rules rather than numbering them; its rules stay out of `ALL`.
preview = true
explicit-preview-rules = true
ignore = [
  "assert",                                    # Asserts state what the type checkers cannot prove.
  "f-string-in-exception",                     # The message is the point of a raise, so it stays on its line rather than in a variable.
  "line-too-long",                             # The formatter already wraps code, and a sentence of prose or a message is one line however long.
  "missing-copyright-notice",                  # LICENSE file is enough.
  "missing-trailing-comma",                    # Conflicts with the formatter.
  "raise-vanilla-args",                        # Each message names its values, so it cannot move into an exception class without one per message.
  "raw-string-in-exception",                   # As `f-string-in-exception`.
  "runtime-cast-value",                        # A `cast()` spells its type like an annotation: unquoted.
  "single-line-implicit-string-concatenation", # Conflicts with the formatter.
  "too-many-arguments",                        # A keyword-only parameter costs its caller nothing, since it is named: `too-many-positional-arguments` counts the ones that do.
  # Reflection resolves annotations at run time, so no import goes in a `TYPE_CHECKING` block.
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-nested-class",
  "undocumented-public-package",
  "useless-import-alias",                      # `X as X` is how PEP 484 marks a re-export, in any module and not only an `__init__.py`.
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"bookshop/*" = [
  "async-function-with-timeout",
  "print",
  "pytest-assert-in-except",
]
"src/*" = ["private-member-access", "pytest-composite-assertion"]
"src/graphql_codegen/runtime/*" = ["relative-imports"]
"src/graphql_codegen/runtime/error.py" = [
  "non-pep695-generic-class", # A legacy `TypeVar`, since a default for a PEP 695 type parameter needs Python 3.13.
]
"src/graphql_codegen/_cli/__init__.py" = ["print"]
"tests/__resources__/*" = ["implicit-namespace-package"]
"tests/*" = [
  "any-type",
  "invalid-class-name",
  "magic-value-comparison",
  "mixed-case-variable-in-class-scope",
  "private-member-access",
  "subprocess-without-shell-equals-true",
  "too-many-positional-arguments",
  "unused-function-argument",
  "unused-lambda-argument",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true

[tool.ty.rules]
# `unused-ignore-comment` included: tests prove a call is a type error by suppressing it, which only holds when a suppression no longer needed fails.
all = "error"
