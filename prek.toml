# The generated package is compared byte for byte by the CLI test.
exclude = "^bookshop/graphql/"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run ruff check --force-exclude --fix --exit-non-zero-on-fix"
types = ["python"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run ruff format --force-exclude --exit-non-zero-on-format"
types = ["python"]
require_serial = true

[[repos.hooks]]
id = "uv-check"
name = "uv check"
language = "system"
entry = "uv check --preview-features check-command"
pass_filenames = false
always_run = true

# From npm directly, with a Node that prek installs itself: no mirror repository, nothing for contributors to install.
[[repos.hooks]]
id = "prettier"
name = "prettier"
language = "node"
additional_dependencies = ["prettier@3.9.10"]
# README code blocks are excerpts of formatted files, checked by `test_readme.py`, with `# …` lines prettier would move.
entry = "prettier --write --ignore-unknown --embedded-language-formatting=off"
# By extension, since prek does not know `.graphqls` as GraphQL.
files = '\.(graphqls?|md|ya?ml)$'
