# The generated package is compared byte for byte by the CLI test.
exclude = "^bookshop/graphql/"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run ruff check --force-exclude --fix --exit-non-zero-on-fix"
types = ["python"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run ruff format --force-exclude --exit-non-zero-on-format"
types = ["python"]
require_serial = true

[[repos.hooks]]
id = "uv-check"
name = "uv check"
language = "system"
entry = "uv check --preview-features check-command"
pass_filenames = false
always_run = true
